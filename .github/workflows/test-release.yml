name: Test-Release (temporary)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no release published)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run semantic-release
        run: |
          npx -p semantic-release@22 -p conventional-changelog-conventionalcommits@7 \
            semantic-release --branches "${{ github.ref_name }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
