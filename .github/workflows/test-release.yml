name: Test-Release (temporary)

# Temporary workflow for manually validating the in-house release script
# (.github/scripts/release.sh) on a fork, without waiting for the
# "Validate Deployment" workflow. Runs in dry-run mode by default so nothing
# is published. Remove this file once validation is complete.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no release published, no PRs annotated)"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run in-house release script
        run: bash .github/scripts/release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
